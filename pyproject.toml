[build-system]
# 77 is the floor for PEP 639 license metadata (the SPDX string and
# license-files below). Anything older rejects them.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-model-lab"
description = "A Claude Code harness for researching, training, and embedding tiny task-specific models"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melissa Pereira" }]
keywords = ["tiny-models", "on-device", "edge-ai", "design-engineering", "claude-code", "harness"]
# No "License ::" classifier: deprecated alongside the old license table, and
# redundant now that `license` carries an SPDX expression.
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0"]

# Read from harness/__init__.py, so the number lives in exactly one place.
# Deriving it the other way — importlib.metadata inside __init__ — would break
# running from a clone without installing, which examples/01-hello-tiny/run.py
# relies on via sys.path.insert.
dynamic = ["version"]

[project.optional-dependencies]
# The harness core is deliberately dependency-light so the gates run anywhere.
train = ["torch>=2.2", "numpy>=1.26", "scikit-learn>=1.4"]
export = ["onnx>=1.16", "onnxruntime>=1.18", "coremltools>=8.0"]
# ruff is floored deliberately. Its *default* rule set has grown across
# releases, and an unpinned linter is what broke CI before it was ever green —
# the build failed on code nobody had touched. [tool.ruff.lint] below pins the
# families; this pins the tool that reads them.
dev = ["pytest>=8.0", "ruff>=0.16"]

[project.scripts]
# Sugar. `python -m harness <cmd>` is the documented form because it needs no
# reinstall and works straight out of a clone.
tml = "harness.__main__:main"

[project.urls]
Homepage = "https://github.com/melissa-pereira-deel/tiny-model-lab"
Issues = "https://github.com/melissa-pereira-deel/tiny-model-lab/issues"

[tool.setuptools]
packages = ["harness"]
# harness/templates holds data, not code. Saying so explicitly stops setuptools
# warning that a directory it can see is missing from `packages` — the files
# ship either way, but a build that warns is not a build anyone reads.
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "harness.__version__" }

# The templates ship with the package. Without this, `pip install` gave you the
# gates and none of the contract to fill in, so `harness init` had nothing to
# copy and cloning was the only adoption path that worked.
[tool.setuptools.package-data]
harness = ["templates/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pinned explicitly. Ruff's *default* rule set has grown over releases, so a
# repo that relies on the default lints clean today and fails CI the day the
# linter ships a new default. Naming the families here makes `ruff check .`
# deterministic across versions.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "BLE"]
