[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-model-lab"
version = "0.1.0"
description = "A Claude Code harness for researching, training, and embedding tiny task-specific models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Melissa Pereira" }]
keywords = ["tiny-models", "on-device", "edge-ai", "design-engineering", "claude-code", "harness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# The harness core is deliberately dependency-light so the gates run anywhere.
train = ["torch>=2.2", "numpy>=1.26", "scikit-learn>=1.4"]
export = ["onnx>=1.16", "onnxruntime>=1.18", "coremltools>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
# Sugar. `python -m harness <cmd>` is the documented form because it needs no
# reinstall and works straight out of a clone.
tml = "harness.__main__:main"

[project.urls]
Homepage = "https://github.com/melissa-pereira-deel/tiny-model-lab"
Issues = "https://github.com/melissa-pereira-deel/tiny-model-lab/issues"

[tool.setuptools]
packages = ["harness"]

# The templates ship with the package. Without this, `pip install` gave you the
# gates and none of the contract to fill in, so `harness init` had nothing to
# copy and cloning was the only adoption path that worked.
[tool.setuptools.package-data]
harness = ["templates/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pinned explicitly. Ruff's *default* rule set has grown over releases, so a
# repo that relies on the default lints clean today and fails CI the day the
# linter ships a new default. Naming the families here makes `ruff check .`
# deterministic across versions.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "BLE"]
