name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    # ubuntu-latest is inherited on purpose. It migrates to Ubuntu 26 from
    # 2026-10-19 and finding that out here is the point: the matrix already
    # pins what matters, nothing in harness/ is OS-specific, and example-02
    # asserts a clean tree rather than exact numbers, so the migration cannot
    # fail this build on numerics. The last break here was drift, and the fix
    # was pinning the tool (ruff>=0.16), not freezing the world.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      # v4/v5 targeted Node 20 and were being force-run on 24. Every major from
      # checkout v5 and setup-python v6 declares `using: node24`; these are the
      # current ones. dependabot keeps them that way.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Validate every experiment file
        run: |
          for f in harness/templates/experiment.yaml examples/*/experiment.yaml; do
            python -c "import yaml,sys; yaml.safe_load(open('$f'))"
          done
      - name: Every committed experiment passes validate
        run: |
          shopt -s nullglob
          status=0
          for f in examples/*/experiment.yaml experiments/*.yaml; do
            python -m harness validate "$f" || status=1
          done
          exit $status
      - name: Worked example runs
        run: python examples/01-hello-tiny/run.py
      - run: ruff check .
      - run: pytest -q

  # Separate job, one Python version, because it pulls ~130 MB of torch. Runs
  # alongside the matrix rather than inside it: the harness core stays
  # dependency-light, but an example CI never executes is an example that rots.
  example-02:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Not ".[export]" — that bundles coremltools, which the ONNX path does
      # not touch. Install what the example actually imports.
      - run: pip install -e ".[train]" onnx onnxruntime
      - name: Second worked example trains, exports and gates
        run: python examples/02-config-lexer/run.py
      - name: It leaves the working tree clean
        run: |
          git status --porcelain > /tmp/dirty
          if [ -s /tmp/dirty ]; then
            echo "the example wrote something it should not have:"
            cat /tmp/dirty
            exit 1
          fi
