name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Validate every experiment file
        run: |
          for f in templates/experiment.yaml examples/*/experiment.yaml; do
            python -c "import yaml,sys; yaml.safe_load(open('$f'))"
          done
      - name: Every committed experiment passes validate
        run: |
          shopt -s nullglob
          status=0
          for f in examples/*/experiment.yaml experiments/*.yaml; do
            python -m harness.validate "$f" || status=1
          done
          exit $status
      - name: Worked example runs
        run: python examples/01-hello-tiny/run.py
      - run: ruff check .
      - run: pytest -q
